name: Bump Version and Create PR

on:
  workflow_dispatch:
    inputs:
      BUMP_TYPE:
        description: "Select the bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install modules
        run: |
          npm ci --prefix enabler
          npm version --prefix enabler ${{ inputs.BUMP_TYPE }}

          npm ci --prefix processor
          npm version --prefix processor ${{ inputs.BUMP_TYPE }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Commits are created through the GitHub API so they are signed as
          # `github-actions[bot]` and show up as "Verified".
          sign-commits: true
          commit-message: "chore: bump version"
          branch: "bump-version-branch"
          title: "Bump version"
          body: "This PR bumps the version. This is executed by a GitHub Action `bump.yaml`."
          labels: "version bump"
